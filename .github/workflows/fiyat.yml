name: Fiyat Kontrol

# GitHub'ın zamanlayıcısı (cron) saatlerce gecikebiliyor. Bu yüzden her çalışma
# ~5.5 saat boyunca 30 dakikada bir kontrol eder, bitince bir sonrakini kendisi başlatır.
# Cron sadece zincir bir şekilde koparsa yeniden başlatmak için yedek.
on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Test mesajı gönder"
        type: boolean
        default: false
      tur:
        description: "Kaç kontrol yapılsın"
        default: "11"
      ara:
        description: "Kontroller arası saniye"
        default: "1800"

permissions:
  contents: write
  actions: write

concurrency:
  group: fiyat
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      WHATSAPP_TELEFON: ${{ secrets.WHATSAPP_TELEFON }}
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Kütüphaneler
        run: pip install -r requirements.txt

      - name: Chromium önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Chromium kur
        run: python -m playwright install --with-deps chromium

      - name: Test
        if: ${{ inputs.test }}
        run: python fiyat_botu.py --test

      - name: Fiyatları kontrol et (döngü)
        if: ${{ !inputs.test }}
        run: |
          git config user.name "fiyat-botu"
          git config user.email "fiyat-botu@users.noreply.github.com"
          TUR="${{ inputs.tur || '11' }}"
          ARA="${{ inputs.ara || '1800' }}"
          for i in $(seq 1 "$TUR"); do
            git pull -q --rebase || true
            python fiyat_botu.py --once || true
            git add fiyat_durum.json
            git diff --cached --quiet || (git commit -qm "fiyat güncellendi" && (git push -q || (git pull -q --rebase && git push -q)))
            if [ "$i" -lt "$TUR" ]; then sleep "$ARA"; fi
          done

      - name: Sonraki çalışmayı başlat
        if: ${{ !inputs.test && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/actions/workflows/fiyat.yml/dispatches" -f ref=main
